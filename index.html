<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04 Make a Tone</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #141414;
    }
    canvas {
      touch-action: none; /* a finger on the canvas never scrolls the page */
    }
  </style>

  <!-- p5.js 2.x -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.js"></script>

  <!-- p5.sound: loads, plays and changes the sound -->
  <script src="https://cdn.jsdelivr.net/npm/p5.js-compatibility@0.2.0/src/preload.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.3.0/dist/p5.sound.min.js"></script>

  <!-- p5-phone: the sound tap and gesture lock -->
  <script src="https://cdn.jsdelivr.net/npm/p5-phone@1.15.0/dist/p5-phone.min.js"></script>
    <script type="module">
    import { SplendidGrandPiano } from "https://unpkg.com/smplr/dist/index.mjs"; // needs to be a url
    const context = new AudioContext(); // create the audio context
    const piano = SplendidGrandPiano(context); // create and load the instrument

    document.getElementById("btn").onclick = () => {
      context.resume(); // enable audio context after a user interaction
      piano.start({ note: 60, velocity: 80 }); // play the note
    };
  </script>
</head>
<body>
  <script src="sketch.js"></script>
</body>
</html>
